<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Course Calendar | RDaSH Learning Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse Learning Hub courses by date in the course calendar.">
  <link rel="icon" type="image/png" href="favicon-16x16.png" sizes="16x16">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css">
  <link rel="stylesheet" href="style/style.css">
</head>

<body>
  <header class="trust-header">
    <div class="new-page-container trust-header__inner">
      <a class="trust-brand" href="index.html" aria-label="RDaSH Learning Hub home">
        <img
          class="rdash-logo"
          src="Assets/learning_hub_logo.svg"
          alt="Rotherham Doncaster and South Humber NHS Foundation Trust Logo"
        >
      </a>
      <img
        class="trust-header__logo"
        src="Assets/rdashwhite.PNG"
        alt="Rotherham Doncaster and South Humber NHS Foundation Trust"
      >
    </div>
  </header>

  <div id="primary-nav-mount"></div>

  <section class="hero" aria-labelledby="page-title">
    <div class="new-page-container hero__inner">
      <h1 id="page-title">Course calendar</h1>
      <p class="hero__intro">
        Browse scheduled learning by date. Use the filters to find courses, videos, and Quality
        Improvement sessions.
      </p>
    </div>
  </section>

  <main class="new-page-container content" id="main-content">
    <div class="catalogue-layout">
      <aside class="panel catalogue-filters" aria-labelledby="filter-title">
        <h2 id="filter-title">Filter learning</h2>
        <form id="course-filters">
          <div class="catalogue-field">
            <label for="course-name">Name</label>
            <input
              class="catalogue-input"
              id="course-name"
              name="name"
              type="search"
              autocomplete="off"
              placeholder="Search course names"
            >
          </div>

          <div class="catalogue-field">
            <label for="date-from">From</label>
            <input class="catalogue-input" id="date-from" name="from" type="date">
          </div>

          <div class="catalogue-field">
            <label for="date-to">To</label>
            <input class="catalogue-input" id="date-to" name="to" type="date">
          </div>

          <div class="catalogue-field">
            <label for="item-type">Item type</label>
            <select class="catalogue-input" id="item-type" name="itemType">
              <option value="">All item types</option>
            </select>
          </div>

          <fieldset class="catalogue-topics">
            <legend>Topics</legend>
            <div class="catalogue-topic-options" id="topic-options">
              <p>Loading topics…</p>
            </div>
          </fieldset>

          <button class="catalogue-reset" type="reset">Clear filters</button>
        </form>
      </aside>

      <section class="catalogue-results" aria-labelledby="calendar-title">
        <div class="section-heading">
          <h2 id="calendar-title">Scheduled learning</h2>
          <p class="catalogue-count" id="course-count" aria-live="polite"></p>
        </div>
        <p class="catalogue-empty calendar-message" id="calendar-message" role="status" hidden></p>
        <div class="course-calendar" id="course-calendar" aria-label="Learning course calendar"></div>
        <p class="calendar-list-link">
          <a class="text-link" href="catalogue.html">
            View learning as a list <span aria-hidden="true">→</span>
          </a>
        </p>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="new-page-container footer__inner">
      <p>© RDaSH · Learning Hub</p>
      <p>
        <a href="faqs.html">Accessibility</a> &nbsp;·&nbsp;
        <a href="faqs.html">Privacy</a> &nbsp;·&nbsp;
        <a href="feedback.html">Feedback</a>
      </p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <script src="script/core/navigation.js"></script>
  <script src="script/pages/catalogue.js"></script>
</body>

</html>
