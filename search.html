<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Search Results | RDaSH Learning Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search courses, learning resources, and pages on the RDaSH Learning Hub.">
  <link rel="icon" type="image/png" href="favicon-16x16.png" sizes="16x16">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style/style.css">
</head>

<body>
  <div id="header-mount"></div>

  <div id="primary-nav-mount"></div>

  <section class="hero" aria-labelledby="page-title">
    <div class="new-page-container hero__inner">
      <h1 id="page-title">Search learning and training</h1>
      <form class="search-form" role="search" action="search.html" method="get">
        <div class="nhsuk-form-group nhsuk-search-input">
          <label class="nhsuk-label nhsuk-label--s" for="search-query">
            Search courses and website pages
          </label>
          <div class="nhsuk-input-wrapper nhsuk-search-input__wrapper">
            <input
              class="nhsuk-input nhsuk-input--width-10 nhsuk-search-input__input"
              id="search-query"
              name="q"
              type="search"
              autocomplete="off"
              required
              placeholder="For example, safeguarding or quality improvement"
            >
            <button
              class="nhsuk-button nhsuk-button--icon nhsuk-button--small nhsuk-search-input__button"
              type="submit"
              aria-label="Search"
            >
              <svg
                class="nhsuk-icon nhsuk-icon--search"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="16"
                height="16"
                focusable="false"
                aria-hidden="true"
              >
                <path d="m20.7 18.9-4.1-4.1a7 7 0 1 0-1.4 1.4l4 4.1a1 1 0 0 0 1.5 0c.4-.4.4-1 0-1.4ZM6 10.6a5 5 0 1 1 10 0 5 5 0 0 1-10 0Z" />
              </svg>
            </button>
          </div>
        </div>
      </form>
    </div>
  </section>

  <main class="new-page-container content" id="main-content">
    <p class="search-results-summary" id="search-summary" role="status" aria-live="polite"></p>

    <section class="search-results-section" aria-labelledby="course-results-title">
      <div class="section-heading">
        <h2 id="course-results-title">Courses and learning</h2>
        <p class="catalogue-count" id="course-results-count" aria-live="polite"></p>
      </div>
      <div class="search-results-list" id="course-results" aria-live="polite"></div>
    </section>

    <section class="search-results-section" aria-labelledby="page-results-title">
      <div class="section-heading">
        <h2 id="page-results-title">Website pages</h2>
        <p class="catalogue-count" id="page-results-count" aria-live="polite"></p>
      </div>
      <div class="search-results-list" id="page-results" aria-live="polite"></div>
    </section>
  </main>

  <div id="footer-mount"></div>

  <script src="script/core/header.js"></script>
  <script src="script/core/navigation.js"></script>
  <script src="script/core/footer.js"></script>
  <script src="script/pages/search.js"></script>
</body>

</html>
